<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feather Rush — browser integration tests</title>
<style>
  body { font: 12px/1.5 ui-monospace, monospace; background: #0b0e0f; color: #cfe9e4; margin: 0; padding: 12px; }
  iframe { width: 1024px; height: 576px; border: 1px solid #2a3a3a; display: block; margin-bottom: 12px; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<pre id="out">RUNNING</pre>
<script>
(function () {
  'use strict';

  var results = [];
  var frame = null;
  var win = null;
  var doc = null;
  var g = null;
  var harnessError = null;

  function short(value) {
    var text = value == null ? '' : String(value);
    return text.length > 180 ? text.slice(0, 180) + '…' : text;
  }

  function check(name, condition, extra) {
    results.push({ name: name, ok: !!condition, extra: condition ? '' : short(extra) });
  }

  function checkEqual(name, actual, expected) {
    var ok = actual === expected;
    results.push({ name: name, ok: ok, extra: ok ? '' : short('actual=' + JSON.stringify(actual) + ' expected=' + JSON.stringify(expected)) });
  }

  function checkClose(name, actual, expected, tolerance) {
    var ok = Math.abs(actual - expected) <= tolerance;
    results.push({ name: name, ok: ok, extra: ok ? '' : 'actual=' + actual + ' expected=' + expected + '±' + tolerance });
  }

  function note(name, value) {
    results.push({ name: name, ok: true, info: String(value) });
  }

  var progressEl = null;
  function progress(text) {
    if (!progressEl) { progressEl = document.getElementById('out'); }
    if (progressEl) { progressEl.textContent = 'RUNNING: ' + text; }
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function waitFor(fn, timeout, label) {
    var started = Date.now();
    return new Promise(function (resolve, reject) {
      (function poll() {
        var value;
        try { value = fn(); } catch (err) { value = false; }
        if (value) { return resolve(value); }
        if (Date.now() - started > (timeout || 8000)) { return reject(new Error('timeout waiting for ' + (label || 'condition'))); }
        setTimeout(poll, 30);
      })();
    });
  }

  /**
   * Advances the game by N deterministic steps (1/60 s each).
   * The game's own rAF loop is stopped first, so a headless run with virtual
   * time stays reproducible instead of racing the compositor.
   */
  function frames(n, dt) {
    var step = dt || 1 / 60;
    for (var i = 0; i < (n || 1); i++) {
      g.time += step;
      g.update(step);
      g.render();
      g.updatePerfOverlay(step);
    }
    return Promise.resolve();
  }

  function settle(fn) {
    // run a couple of microtask turns so DOM/class updates are visible
    return Promise.resolve().then(fn);
  }

  function click(id) {
    var el = doc.getElementById(id);
    if (!el) { throw new Error('missing element #' + id); }
    el.click();
    return el;
  }

  function key(code) {
    doc.dispatchEvent(new win.KeyboardEvent('keydown', { code: code, key: code, bubbles: true, cancelable: true }));
  }

  function typeNickname(value) {
    var input = doc.getElementById('nickname');
    input.value = value;
    input.dispatchEvent(new win.Event('input', { bubbles: true }));
    return input;
  }

  function activeScreen() {
    var ids = ['screen-menu', 'screen-select', 'screen-pause', 'screen-gameover'];
    for (var i = 0; i < ids.length; i++) {
      var el = doc.getElementById(ids[i]);
      if (el && el.classList.contains('is-active')) { return ids[i]; }
    }
    return null;
  }

  function leadBirdIntoColumn() {
    // put a passage right on top of the bird and drop the bird into its column
    var pair = g.obstacles.pairs[0];
    if (!pair) {
      pair = g.obstacles.createPair(g.bird.x - 20, g.diff, null);
      g.obstacles.pairs.push(pair);
    }
    pair.x = g.bird.x - 40;
    pair.gapTop = g.bird.y + 120;
    pair.gapBottom = g.bird.y + 320;
    return pair;
  }

  /** Renders a sound into an OfflineAudioContext and reports its envelope. */
  async function measureSound(method) {
    var OAC = win.OfflineAudioContext || win.webkitOfflineAudioContext;
    var am = g.audio;
    if (!OAC || !am) { return { skipped: true }; }
    var off = new OAC(1, 44100, 44100);
    var dest = off.createGain();
    dest.gain.value = 1;
    dest.connect(off.destination);
    var realCtx = am.ctx;
    var realSfx = am.sfxGain;
    am.ctx = off;
    am.sfxGain = dest;
    var threw = null;
    try { am[method](); } catch (err) { threw = String(err && err.message); }
    am.ctx = realCtx;
    am.sfxGain = realSfx;
    var buffer = await off.startRendering();
    var data = buffer.getChannelData(0);
    var peak = 0, sum = 0, last = 0;
    for (var i = 0; i < data.length; i++) {
      var v = Math.abs(data[i]);
      if (v > peak) { peak = v; }
      sum += v * v;
      if (v > 0.002) { last = i; }
    }
    return { peak: peak, rms: Math.sqrt(sum / data.length), durationMs: last / 44.1, error: threw };
  }

  /** Measures real update+render cost with forced rasterisation. */
  async function measureFrames(count) {
    var n = count || 120;
    var ctx = g.ctx;
    g.lives = 99;
    g.bird.invulnerable = 999;
    var flush = function () { ctx.getImageData(0, 0, 1, 1); };
    for (var w = 0; w < 10; w++) { g.time += 1 / 60; g.update(1 / 60); g.render(); flush(); }
    var t0 = win.performance.now();
    for (var i = 0; i < n; i++) {
      g.time += 1 / 60;
      g.update(1 / 60);
      g.render();
      flush();
    }
    var ms = (win.performance.now() - t0) / n;
    g.lives = 3;
    g.bird.invulnerable = 0;
    return { msPerFrame: ms };
  }

  async function run() {
    progress('run() entered');
    // Keep the generated soundtrack off: virtual time would fast-forward it.
    try { win.localStorage.setItem('ga.featherrush.v1.music', '0'); } catch (e) { /* ignore */ }

    await waitFor(function () { return win.__GA_GAME__; }, 10000, 'game instance');
    g = win.__GA_GAME__;
    var GA = win.GA;
    g.stop(); // the harness drives the simulation deterministically
    // keep the generated soundtrack silent while the suite runs
    g.applySoundSettings({ music: false, sfx: true }, true);
    await settle();

    /* ---------------- boot & menu ---------------- */
    check('game boots', !!g);
    checkEqual('starts in MENU', g.state, 'MENU');
    checkEqual('menu screen is active', activeScreen(), 'screen-menu');
    var brand = doc.querySelector('.brand__title');
    var subtitle = doc.querySelector('.brand__subtitle');
    checkEqual('brand shows GET ANALYST', brand && brand.textContent.trim(), 'GET ANALYST');
    checkEqual('subtitle shows Feather Rush', subtitle && subtitle.textContent.trim(), 'Feather Rush');
    checkEqual('three bird cards in the menu', doc.querySelectorAll('#bird-cards-menu .bird-card').length, 3);
    checkEqual('menu leaderboard starts empty', !!doc.querySelector('#leaderboard-menu .leaderboard__empty'), true);
    check('canvas has a backing store', doc.getElementById('game-canvas').width > 100);
    check('stage unit variable is set', /px$/.test(doc.getElementById('stage').style.getPropertyValue('--u')));

    progress('menu checks done');
    /* ---------------- nickname ---------------- */
    var playBtn = doc.getElementById('btn-play');
    check('PLAY is disabled with no nickname', playBtn.disabled === true);
    typeNickname('A');
    check('PLAY stays disabled for a 1-character nickname', playBtn.disabled === true);
    typeNickname('Zig! g');
    checkEqual('invalid characters are stripped as you type', doc.getElementById('nickname').value, 'Zigg');
    check('PLAY enabled for a valid nickname', playBtn.disabled === false);
    typeNickname('abcdefghijklmnopqrstuvwxyz');
    checkEqual('nickname is capped at 16 characters', doc.getElementById('nickname').value.length, 16);
    typeNickname('Zig');
    checkEqual('nickname stored in the input', doc.getElementById('nickname').value, 'Zig');

    progress('nickname checks done');
    /* ---------------- bird selection ---------------- */
    var scootCard = doc.querySelector('#bird-cards-menu .bird-card[data-bird="scout"]');
    var cyberCard = doc.querySelector('#bird-cards-menu .bird-card[data-bird="cyber"]');
    check('first bird is selected by default', scootCard.classList.contains('is-selected'));
    click('bird-cards-menu'); // no-op safety
    cyberCard.click();
    await frames(2);
    check('clicking a card selects it', cyberCard.classList.contains('is-selected'));
    check('previous card is deselected', !scootCard.classList.contains('is-selected'));
    checkEqual('bird persisted to localStorage', win.localStorage.getItem('ga.featherrush.v1.bird'), 'cyber');
    checkEqual('game uses the chosen bird', g.birdDef.id, 'cyber');
    cyberCard.click(); cyberCard.click(); cyberCard.click();
    await frames(2);
    check('rapid bird switching keeps exactly one selection',
      doc.querySelectorAll('#bird-cards-menu .bird-card.is-selected').length === 1);
    check('cross-screen selection stays in sync',
      doc.querySelector('#bird-cards-select .bird-card[data-bird="cyber"]').classList.contains('is-selected'));

    progress('bird selection prep done');
    /* ---------------- start a run ---------------- */
    click('btn-play');
    await frames(3);
    checkEqual('PLAY starts the game', g.state, 'PLAYING');
    check('the run waits in the ready state', g.ready === true);
    check('the ready hint is visible', doc.getElementById('ready-hint').classList.contains('is-visible'));
    var readyY = g.bird.y;
    var readyDistance = g.score.distance;
    await frames(45);
    check('the bird hovers instead of free-falling while ready', Math.abs(g.bird.y - readyY) < 30,
      'y ' + readyY.toFixed(1) + ' -> ' + g.bird.y.toFixed(1));
    check('the world does not scroll while ready', g.score.distance === readyDistance);
    key('Space');
    await frames(3);
    check('the first flap starts the run', g.ready === false);
    check('the ready hint disappears', !doc.getElementById('ready-hint').classList.contains('is-visible'));
    checkEqual('score starts at zero', g.score.score, 0);
    checkEqual('three lives at the start', g.lives, 3);
    check('HUD is visible in game', doc.getElementById('hud').classList.contains('is-active'));
    checkEqual('HUD nickname is shown', doc.getElementById('hud-nick').textContent, 'Zig');
    checkEqual('HUD bird is shown', doc.getElementById('hud-bird').textContent, 'CYBER');
    checkEqual('three hearts rendered', doc.querySelectorAll('#hud-lives .life').length, 3);
    checkEqual('no heart lost yet', doc.querySelectorAll('#hud-lives .life.is-lost').length, 0);

    progress('run started');
    /* ---------------- flap & physics ---------------- */
    var yBefore = g.bird.y;
    g.bird.vy = 200;
    key('Space');
    check('Space gives an upward impulse', g.bird.vy < 0, 'vy=' + g.bird.vy);
    await frames(4);
    check('the bird rises after a flap', g.bird.y < yBefore, 'y ' + yBefore.toFixed(1) + ' -> ' + g.bird.y.toFixed(1));

    var yFree = g.bird.y;
    g.bird.vy = -200;
    await frames(45);
    check('gravity pulls the bird down', g.bird.y > yFree, 'y ' + yFree.toFixed(1) + ' -> ' + g.bird.y.toFixed(1));

    for (var i = 0; i < 30; i++) { key('Space'); }
    await frames(3);
    check('mashing 30 flaps keeps the bird in bounds',
      g.bird.y >= g.bird.hitboxRadius - 0.01 && g.bird.y <= GA.WORLD.groundY - g.bird.hitboxRadius + 0.01,
      'y=' + g.bird.y);

    var pointerFired = false;
    g.bird.vy = 300;
    doc.getElementById('game-canvas').dispatchEvent(new win.PointerEvent('pointerdown', {
      bubbles: true, cancelable: true, pointerType: 'touch', isPrimary: true
    }));
    pointerFired = g.bird.vy < 0;
    check('tap/click also flaps', pointerFired);

    progress('flap/physics done');
    /* ---------------- obstacles: pass and collide ---------------- */
    var bonusBefore = g.score.score;
    var giftPair = g.obstacles.createPair(g.bird.x - 160, g.diff, null);
    giftPair.gapTop = Math.max(70, g.bird.y - 150);
    giftPair.gapBottom = Math.min(GA.WORLD.groundY - 80, g.bird.y + 150);
    g.obstacles.pairs.push(giftPair);
    await frames(3);
    check('flying through a passage awards +10', g.score.score >= bonusBefore + 10,
      'score ' + bonusBefore + ' -> ' + g.score.score);
    check('the passage is marked as passed', giftPair.passed === true);

    g.lives = 3;
    g.bird.invulnerable = 0;
    g.ui.setLives(3);
    var livesBefore = g.lives;
    leadBirdIntoColumn();
    await frames(3);
    check('collision costs a life', g.lives === livesBefore - 1, 'lives ' + livesBefore + ' -> ' + g.lives);
    check('a heart is greyed out', doc.querySelectorAll('#hud-lives .life.is-lost').length === 1);
    check('the bird becomes invulnerable', g.bird.isInvulnerable() === true);
    check('the bird blinks while protected', g.bird.getAlpha(g.time) < 1);

    var livesAfterHit = g.lives;
    leadBirdIntoColumn();
    await frames(4);
    checkEqual('a second collision during invulnerability is ignored', g.lives, livesAfterHit);

    progress('obstacles done');
    /* ---------------- worms & combo ---------------- */
    // freeze the world so only the worm under test can change the score
    g.diff.speed = 0;
    g.obstacles.reset();
    g.worms.reset();
    g.bird.invulnerable = 999;
    var scoreBeforeWorm = g.score.score;
    g.worms.spawn(GA.typeById('green'), g.bird.x, g.bird.y);
    await frames(2);
    check('green worm gives +10', g.score.score === scoreBeforeWorm + 10, 'score ' + g.score.score);
    checkEqual('combo counts the worm', g.score.combo, 1);

    g.worms.spawn(GA.typeById('green'), g.bird.x, g.bird.y);
    g.worms.spawn(GA.typeById('green'), g.bird.x, g.bird.y);
    await frames(2);
    checkEqual('combo reaches x2 after three worms', g.score.multiplier, 2);
    var comboEl = doc.getElementById('combo-banner');
    check('combo banner is shown', comboEl.textContent === 'COMBO x2!' &&
      (!comboEl.getAnimations || comboEl.getAnimations().length > 0),
      'text=' + comboEl.textContent + ' animations=' + (comboEl.getAnimations ? comboEl.getAnimations().length : 'n/a'));
    check('combo banner animates without forcing layout',
      typeof comboEl.animate === 'function' && !comboEl.classList.contains('is-showing'));
    checkEqual('HUD combo shows x2', doc.getElementById('hud-combo').textContent, 'x2');

    var scoreBeforeBlue = g.score.score;
    g.worms.spawn(GA.typeById('blue'), g.bird.x, g.bird.y);
    await frames(2);
    checkEqual('blue worm pays 25 x combo', g.score.score, scoreBeforeBlue + 50);

    var scoreBeforeRed = g.score.score;
    g.worms.spawn(GA.typeById('red'), g.bird.x, g.bird.y);
    await frames(2);
    checkEqual('red worm subtracts 25', g.score.score, scoreBeforeRed - 25);
    checkEqual('red worm breaks the combo', g.score.combo, 0);
    checkEqual('multiplier resets', g.score.multiplier, 1);

    g.score.score = 10;
    g.worms.spawn(GA.typeById('red'), g.bird.x, g.bird.y);
    await frames(2);
    checkEqual('score never becomes negative', g.score.score, 0);

    var scoreBeforeGold = g.score.score;
    g.worms.spawn(GA.typeById('gold'), g.bird.x, g.bird.y);
    await frames(2);
    check('golden worm pays 100', g.score.score === scoreBeforeGold + 100, 'score ' + g.score.score);

    g.worms.reset();
    g.worms.spawn(GA.typeById('green'), g.bird.x, g.bird.y);
    g.worms.spawn(GA.typeById('blue'), g.bird.x + 2, g.bird.y + 2);
    g.worms.spawn(GA.typeById('purple'), g.bird.x - 2, g.bird.y - 2);
    await frames(2);
    check('simultaneous worm pickups are all counted', g.score.totalWorms >= 3);

    progress('worms done');
    /* ---------------- progressive difficulty ---------------- */
    g.bird.invulnerable = 0;
    var speedAtStart = g.diff.speed;
    g.score.score = 2200;
    await frames(30);
    check('speed grows with score', g.diff.speed > speedAtStart, speedAtStart.toFixed(0) + ' -> ' + g.diff.speed.toFixed(0));
    check('difficulty level rises', g.diff.level >= 5, 'level ' + g.diff.level);
    check('gap shrinks but never below the minimum', g.diff.gap >= GA.OBSTACLE.minGap - 1, 'gap ' + g.diff.gap.toFixed(0));

    progress('difficulty done');
    /* ---------------- frame budget ---------------- */
    var budget = await measureFrames(120);
    check('a gameplay frame stays inside the frame budget', budget.msPerFrame < 14,
      budget.msPerFrame.toFixed(2) + ' ms/frame (forced rasterisation, software renderer)');
    note('measured frame cost', budget.msPerFrame.toFixed(2) + ' ms');

    key('KeyF');
    await frames(30);
    var perfEl = doc.getElementById('perf-hud');
    check('F shows the performance overlay', perfEl.classList.contains('is-visible'));
    check('the overlay reports fps and the render scale', /FPS/.test(perfEl.textContent) && /x/.test(perfEl.textContent),
      perfEl.textContent);
    note('perf overlay', perfEl.textContent);
    key('KeyF');
    await frames(2);
    check('F hides the overlay again', !perfEl.classList.contains('is-visible'));

    /* ---------------- pause ---------------- */
    key('KeyP');
    await frames(2);
    checkEqual('P pauses the game', g.state, 'PAUSED');
    checkEqual('pause screen is active', activeScreen(), 'screen-pause');
    var scoreAtPause = g.score.score;
    await frames(10);
    checkEqual('the world is frozen while paused', g.score.score, scoreAtPause);
    key('KeyP');
    await frames(2);
    checkEqual('P resumes the game', g.state, 'PLAYING');
    checkEqual('game screen restored', activeScreen(), null);

    win.dispatchEvent(new win.Event('blur'));
    await frames(2);
    checkEqual('losing focus auto-pauses', g.state, 'PAUSED');
    click('btn-resume');
    await frames(2);
    checkEqual('RESUME continues the run', g.state, 'PLAYING');

    progress('pause done');
    /* ---------------- game over ---------------- */
    g.score.score = 1234;
    g.lives = 1;
    g.bird.invulnerable = 0;
    leadBirdIntoColumn();
    await frames(4);
    checkEqual('losing the last life ends the run', g.state, 'GAME_OVER');
    checkEqual('game over screen is active', activeScreen(), 'screen-gameover');
    checkEqual('HUD hidden after game over', doc.getElementById('hud').classList.contains('is-active'), false);
    check('game over shows the player', doc.getElementById('go-player').textContent === 'Zig');
    check('game over shows the bird', doc.getElementById('go-bird').textContent === 'Cyber');
    check('game over shows the score', doc.getElementById('go-score').textContent.replace(/\s/g, '').length > 0);
    check('new high score banner is visible', doc.getElementById('go-new-high').classList.contains('is-visible'));
    check('confetti was spawned', g.particles.count() > 0);

    var stored = JSON.parse(win.localStorage.getItem('ga.featherrush.v1.scores') || '[]');
    check('score saved to localStorage', stored.length === 1, JSON.stringify(stored));
    checkEqual('saved nickname', stored[0] && stored[0].nickname, 'Zig');
    checkEqual('saved bird', stored[0] && stored[0].bird, 'cyber');
    check('saved score matches the run', stored[0] && stored[0].score >= 1234, JSON.stringify(stored[0]));
    check('saved date present', !!(stored[0] && stored[0].date));
    check('leaderboard rendered a row', doc.querySelectorAll('#leaderboard-menu .leaderboard__row').length >= 1);
    check('runtime error list is empty', !win.__GA_ERRORS__ || win.__GA_ERRORS__.length === 0,
      JSON.stringify(win.__GA_ERRORS__));
    check('no fatal banner', !doc.getElementById('fatal').classList.contains('is-visible'));

    /* ---------------- player falls after death ---------------- */
    var deadY = g.bird.y;
    await frames(45);
    check('the bird tumbles after game over', g.bird.y > deadY, 'y ' + deadY.toFixed(0) + ' -> ' + g.bird.y.toFixed(0));

    progress('game over done');
    /* ---------------- play again ---------------- */
    click('btn-play-again');
    await frames(3);
    checkEqual('PLAY AGAIN restarts the run', g.state, 'PLAYING');
    checkEqual('score reset', g.score.score, 0);
    checkEqual('lives reset', g.lives, 3);
    checkEqual('combo reset', g.score.combo, 0);
    checkEqual('no grey hearts after restart', doc.querySelectorAll('#hud-lives .life.is-lost').length, 0);
    check('nickname kept after restart', g.ui.getNickname() === 'Zig');
    check('a restarted run waits for the first flap again', g.ready === true);
    key('Space');
    await frames(3);
    check('the restarted run is live', g.ready === false);

    progress('play again done');
    /* ---------------- change bird ---------------- */
    g.lives = 1; g.bird.invulnerable = 0;
    leadBirdIntoColumn();
    await frames(4);
    checkEqual('back in game over', g.state, 'GAME_OVER');
    click('btn-change-bird');
    await frames(3);
    checkEqual('CHANGE BIRD opens character select', g.state, 'CHARACTER_SELECT');
    checkEqual('character select screen is active', activeScreen(), 'screen-select');
    check('nickname preserved on the select screen', g.ui.getNickname() === 'Zig');
    check('select screen shows the player', doc.getElementById('select-nick').textContent.indexOf('Zig') >= 0);

    doc.querySelector('#bird-cards-select .bird-card[data-bird="scout"]').click();
    await frames(2);
    checkEqual('choosing Scout persists', win.localStorage.getItem('ga.featherrush.v1.bird'), 'scout');
    click('btn-select-play');
    await frames(3);
    checkEqual('PLAY from select starts the run', g.state, 'PLAYING');
    checkEqual('the chosen bird is used in game', g.birdDef.id, 'scout');
    checkEqual('HUD shows the new bird', doc.getElementById('hud-bird').textContent, 'SCOUT');

    click('btn-pause');
    await frames(2);
    checkEqual('pause button pauses', g.state, 'PAUSED');
    click('btn-menu-pause');
    await frames(3);
    checkEqual('MAIN MENU leaves the run', g.state, 'MENU');
    checkEqual('menu screen is active again', activeScreen(), 'screen-menu');

    progress('change bird done');
    /* ---------------- leaderboard persistence across reload ---------------- */
    var rowsBeforeReload = doc.querySelectorAll('#leaderboard-menu .leaderboard__row').length;
    win.location.reload();
    await waitFor(function () { return win.__GA_GAME__ && win.__GA_GAME__ !== g; }, 10000, 'game after reload');
    g = win.__GA_GAME__;
    GA = win.GA;
    g.stop();
    await frames(3);
    checkEqual('reload keeps the nickname', g.ui.getNickname(), 'Zig');
    checkEqual('reload keeps the chosen bird', g.menuSelector.getSelected(), 'scout');
    check('reload keeps the leaderboard',
      doc.querySelectorAll('#leaderboard-menu .leaderboard__row').length === rowsBeforeReload,
      'rows ' + doc.querySelectorAll('#leaderboard-menu .leaderboard__row').length + ' vs ' + rowsBeforeReload);
    check('reload keeps the best score', g.best >= 1234, 'best=' + g.best);
    check('reload keeps the HUD best value', g.score.best >= 1234, 'score.best=' + g.score.best);

    progress('reload done');
    /* ---------------- clear scores ---------------- */
    click('btn-clear-menu');
    await frames(2);
    check('CLEAR SCORES asks for confirmation', doc.getElementById('modal').classList.contains('is-open'));
    click('modal-cancel');
    await frames(2);
    check('cancel keeps the scores', doc.querySelectorAll('#leaderboard-menu .leaderboard__row').length > 0);
    click('btn-clear-menu');
    await frames(2);
    click('modal-ok');
    await frames(3);
    check('confirm wipes the leaderboard', !!doc.querySelector('#leaderboard-menu .leaderboard__empty'));
    checkEqual('storage cleared too', win.localStorage.getItem('ga.featherrush.v1.scores'), null);

    progress('clear scores done');
    /* ---------------- sound ---------------- */
    g.applySoundSettings({ music: true, sfx: true });
    await frames(1);
    var musicToggle = doc.getElementById('toggle-music');
    check('music toggle starts on', musicToggle.classList.contains('is-on'));
    musicToggle.click();
    await frames(1);
    checkEqual('music toggle persists off', win.localStorage.getItem('ga.featherrush.v1.music'), '0');
    check('music toggle is visually off', !doc.getElementById('toggle-music').classList.contains('is-on'));
    doc.getElementById('toggle-music').click();
    await frames(1);
    checkEqual('music toggle persists on', win.localStorage.getItem('ga.featherrush.v1.music'), '1');
    g.audio.startMusic();
    check('music engine reports playing', g.audio.isMusicPlaying() === true);
    g.audio.stopMusic();
    check('music engine stops', g.audio.isMusicPlaying() === false);

    doc.getElementById('toggle-sfx').click();
    await frames(1);
    checkEqual('sfx toggle persists off', win.localStorage.getItem('ga.featherrush.v1.sfx'), '0');
    check('sfx is muted in the engine', g.audio.settings.sfx === false);
    checkEqual('muted sfx does not play', g.audio.play('flap'), false);
    doc.getElementById('toggle-sfx').click();
    await frames(1);
    if (g.audio.available && g.audio.ctx) {
      checkEqual('unmuted sfx plays', g.audio.play('flap'), true);
      note('AudioContext state', g.audio.ctx.state);
    } else {
      note('Web Audio unavailable in this runner', 'skipped');
    }

    /* ---------------- generated (pre-rendered) soundtrack ---------------- */
    g.audio.unlock();
    await waitFor(function () { return g.audio._loopsBaked || g.audio._loopFailed; }, 25000, 'offline music render');
    check('the soundtrack is pre-rendered offline', g.audio._loopsBaked === true, 'loopFailed=' + g.audio._loopFailed);
    if (g.audio._loopsBaked) {
      check('both intensity variants exist', !!g.audio._loops.calm && !!g.audio._loops.full);
      check('the loop is a full 4-bar phrase', g.audio._loops.calm.duration > 9, 'duration=' + g.audio._loops.calm.duration.toFixed(2) + 's');
      g.applySoundSettings({ music: true, sfx: true });
      g.audio.setIntensity(5);
      g.audio.startMusic();
      await sleep(700);
      check('looping sources are running', !!g.audio._loopNodes);
      check('no live scheduler is needed any more', !g.audio._timer);
      var analyser = g.audio.ctx.createAnalyser();
      analyser.fftSize = 2048;
      g.audio.master.connect(analyser);
      var samples = new Float32Array(analyser.fftSize);
      var musicPeak = 0, musicRms = 0;
      for (var poll = 0; poll < 14; poll++) {
        await sleep(100);
        analyser.getFloatTimeDomainData(samples);
        var energy = 0;
        for (var si = 0; si < samples.length; si++) {
          energy += samples[si] * samples[si];
          var abs = Math.abs(samples[si]);
          if (abs > musicPeak) { musicPeak = abs; }
        }
        var rms = Math.sqrt(energy / samples.length);
        if (rms > musicRms) { musicRms = rms; }
      }
      check('the music is actually audible', musicPeak > 0.01,
        'peak=' + musicPeak.toFixed(4) + ' rms=' + musicRms.toFixed(5));
      note('music level', 'peak ' + musicPeak.toFixed(4) + ', rms ' + musicRms.toFixed(5));
      g.audio.stopMusic();
      check('music stops cleanly', !g.audio._loopNodes && g.audio.isMusicPlaying() === false);
    }

    /* ---------------- recorded flap sample ---------------- */
    g.audio.unlock();
    await waitFor(function () { return g.audio._flapSample || g.audio._flapSampleFailed; }, 12000, 'flap sample decode');
    check('the recorded fart sample decodes', !!g.audio._flapSample,
      'decodeFailed=' + g.audio._flapSampleFailed);
    if (g.audio._flapSample) {
      var sampleData = g.audio._flapSample.getChannelData(0);
      var samplePeak = 0;
      for (var sdi = 0; sdi < sampleData.length; sdi++) {
        var absv = Math.abs(sampleData[sdi]);
        if (absv > samplePeak) { samplePeak = absv; }
      }
      check('the sample is normalised and loud', samplePeak > 0.5, 'peak=' + samplePeak.toFixed(3));
      check('the sample is a short burst', g.audio._flapSample.duration > 0.1 && g.audio._flapSample.duration < 0.4,
        'duration=' + g.audio._flapSample.duration.toFixed(3) + 's');
      checkEqual('the sample is mono', g.audio._flapSample.numberOfChannels, 1);
      note('flap sample', 'duration ' + g.audio._flapSample.duration.toFixed(3) + ' s, peak ' +
        samplePeak.toFixed(3) + ', ' + g.audio._flapSample.sampleRate + ' Hz');
      g.applySoundSettings({ music: false, sfx: true });
      checkEqual('the flap plays the recorded sample', g.audio.play('flap'), true);
    }

    /* ---------------- the synthesised fart stays as a fallback ---------------- */
    var fart = await measureSound('_fart');
    if (fart.skipped) {
      note('offline audio unavailable, fart not measured', 'skipped');
    } else {
      check('the flap sound synthesises without errors', !fart.error, 'error=' + fart.error);
      check('the flap sound has body', fart.peak > 0.12, 'peak=' + fart.peak.toFixed(3));
      check('the flap sound is a proper fart, not a click', fart.durationMs > 250 && fart.durationMs < 950,
        'length=' + fart.durationMs.toFixed(0) + 'ms');
      check('the flap sound is loud enough to be unmistakable', fart.rms > 0.02,
        'rms=' + fart.rms.toFixed(4));
      note('flap sound', 'peak ' + fart.peak.toFixed(3) + ', rms ' + fart.rms.toFixed(4) +
        ', ' + fart.durationMs.toFixed(0) + ' ms');
    }

    click('btn-sound');
    await frames(1);
    checkEqual('mute button silences everything', win.localStorage.getItem('ga.featherrush.v1.sfx'), '0');
    check('mute icon updates', doc.getElementById('btn-sound').textContent === '🔇');
    click('btn-sound');
    await frames(1);
    checkEqual('unmute restores audio settings', win.localStorage.getItem('ga.featherrush.v1.sfx'), '1');

    progress('sound done');
    /* ---------------- responsive ---------------- */
    var stage = doc.getElementById('stage');
    var canvas = doc.getElementById('game-canvas');
    var beforeWidth = canvas.width;
    frame.style.width = '420px';
    frame.style.height = '236px';
    win.dispatchEvent(new win.Event('resize'));
    await frames(2);
    check('canvas keeps a 16:9 ratio at any render scale', Math.abs(canvas.width / canvas.height - 16 / 9) < 0.02,
      canvas.width + 'x' + canvas.height);
    check('render scale stays inside its budget', g.renderScale >= 0.6 && g.renderScale <= 1.5,
      'scale=' + g.renderScale);
    check('canvas matches the render scale', canvas.width === Math.round(1280 * g.renderScale),
      canvas.width + ' vs ' + Math.round(1280 * g.renderScale));
    var unit = parseFloat(stage.style.getPropertyValue('--u'));
    check('layout unit scales with the stage', unit > 0 && unit < 1.2, 'unit=' + unit);
    void beforeWidth;
    var overflow = doc.querySelector('.panel').getBoundingClientRect();
    check('menu panel fits inside the stage', overflow.width <= stage.getBoundingClientRect().width + 1);
    frame.style.width = '1024px';
    frame.style.height = '576px';
    win.dispatchEvent(new win.Event('resize'));
    await frames(2);

    progress('responsive done');
    /* ---------------- final error sweep ---------------- */
    check('still no runtime errors', !win.__GA_ERRORS__ || win.__GA_ERRORS__.length === 0,
      JSON.stringify(win.__GA_ERRORS__));
    check('no fatal banner at the end', !doc.getElementById('fatal').classList.contains('is-visible'));
  }

  function finish() {
    var failed = results.filter(function (r) { return !r.ok; });
    var out = {
      total: results.length,
      passed: results.length - failed.length,
      failed: failed.length,
      failures: failed,
      info: results.filter(function (r) { return r.info; }),
      harnessError: harnessError
    };
    document.getElementById('out').textContent = 'TESTRESULT_START\n' + JSON.stringify(out, null, 1) + '\nTESTRESULT_END';
  }

  function boot() {
    // Chromium only advances its virtual clock while the page has pending tasks.
    // The harness stops the game loop, so this heartbeat keeps
    // --virtual-time-budget ticking until the DOM dump is taken.
    setInterval(function () {}, 200);

    // Music off before the game boots: virtual time would fast-forward the scheduler.
    try {
      localStorage.removeItem('ga.featherrush.v1.scores');
      localStorage.removeItem('ga.featherrush.v1.nickname');
      localStorage.removeItem('ga.featherrush.v1.bird');
    } catch (e) { /* ignore */ }

    frame = document.createElement('iframe');
    frame.id = 'frame';
    frame.style.width = '1024px';
    frame.style.height = '576px';
    frame.src = '../index.html';
    progress('booting: iframe created');
    var suiteStarted = false;
    frame.addEventListener('load', function () {
      progress('iframe loaded');
      win = frame.contentWindow;
      doc = frame.contentDocument;
      if (suiteStarted) { return; } // the reload test navigates the iframe on purpose
      suiteStarted = true;
      run().catch(function (err) {
        harnessError = err && err.stack ? err.stack : String(err);
        progress('harness error: ' + harnessError.split('\n')[0]);
      }).then(finish);
    });
    frame.addEventListener('error', function () { progress('iframe error event'); });
    document.body.insertBefore(frame, document.getElementById('out'));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
